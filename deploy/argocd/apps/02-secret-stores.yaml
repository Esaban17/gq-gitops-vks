# ClusterSecretStore(s) de la plataforma (Azure Key Vault).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Esaban17/gq-gitops-vks.git
    targetRevision: main
    path: deploy/platform/secret-stores
  destination:
    name: gq-apps-01
    namespace: external-secrets
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
