# External Secrets Operator: chart oficial instalado como Application de Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
  destination:
    name: gq-apps-01            # clúster VKS registrado en Argo CD (lab/argocd/registrar-cluster-vks.sh)
    namespace: external-secrets
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true     # los CRDs de ESO son grandes para client-side apply
