# ClusterSecretStore hacia AWS Secrets Manager (paso 8 del diagrama: ESO lee el almacén externo en modo pull).
# Equivalente al Key Vault + service principal del diagrama original:
#   usuario IAM "eso-gq-lab" con política de solo lectura sobre los secretos gq-lab/*.
# El access key NO va en Git: lo crea lab/aws/02-bootstrap-eso-creds.sh como Secret
# "aws-sm-creds" en el namespace external-secrets del clúster VKS.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-sm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1          # misma región que usa lab/aws/01-crear-secretos.sh (AWS_REGION)
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-sm-creds
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-sm-creds
            namespace: external-secrets
            key: secret-access-key
