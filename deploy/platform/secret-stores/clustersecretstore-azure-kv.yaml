# ClusterSecretStore hacia Azure Key Vault (paso 8 del diagrama: ESO lee Key Vault en modo pull).
# Autenticación: service principal de Entra ID con rol "Key Vault Secrets User" sobre el vault.
# El client id y el client secret NO van en Git: los crea lab/azure/02-bootstrap-eso-sp.sh
# como Secret "azure-kv-sp" en el namespace external-secrets del clúster VKS.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv
  annotations:
    # El CRD lo instala la Application external-secrets; evita fallar el dry-run si aún no existe
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    azurekv:
      # Reemplazar con la salida de lab/azure/01-crear-keyvault.sh
      vaultUrl: "https://REEMPLAZAR-NOMBRE-VAULT.vault.azure.net"
      tenantId: "REEMPLAZAR-TENANT-ID"
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: azure-kv-sp
          namespace: external-secrets
          key: client-id
        clientSecret:
          name: azure-kv-sp
          namespace: external-secrets
          key: client-secret
