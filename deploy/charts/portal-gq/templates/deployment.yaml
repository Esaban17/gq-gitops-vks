apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portal-gq.name" . }}
  labels: {{- include "portal-gq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {{- include "portal-gq.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "portal-gq.selector" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ required "image.tag es obligatorio" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.service.targetPort }}}
          env:
            - {name: AMBIENTE, value: {{ .Values.ambiente | quote }}}
            - {name: APP_VERSION, value: {{ .Values.image.tag | quote }}}
          # Variables desde el Secret nativo que crea ESO (cambian al reiniciar el pod)
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecrets.appSecret.name }}
          volumeMounts:
            # El mismo Secret montado como archivo: kubelet lo actualiza en vivo
            - {name: config, mountPath: /etc/portal, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.externalSecrets.appSecret.name }}
            items:
              - {key: MENSAJE, path: mensaje}
        - name: tmp
          emptyDir: {}
