# ESO lee AWS Secrets Manager (pull) y crea Secrets nativos en este namespace.
# Wave -1: se crean antes que el Deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.appSecret.name }}
  labels: {{- include "portal-gq.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.externalSecrets.appSecret.name }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.appSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- if .Values.externalSecrets.pullSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.pullSecret.name }}
  labels: {{- include "portal-gq.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.externalSecrets.pullSecret.name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: {{`'{"auths":{"`}}{{ .Values.externalSecrets.pullSecret.registry }}{{`":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'`}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.pullSecret.remoteKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.pullSecret.remoteKey }}
        property: password
{{- end }}
