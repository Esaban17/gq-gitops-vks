# Pasos 1 a 3 del diagrama:
#  1) push en app/ dispara el pipeline
#  2) build de la imagen y push a Amazon ECR (equivalente a ACR). Login por OIDC: sin llaves en GitHub.
#  3) PR que actualiza image.tag en deploy/environments/lab/values.yaml
# Harbor replica la imagen desde ECR (paso 4) y Argo CD despliega cuando se fusiona el PR (5 y 6).
# Requiere la variable de repositorio AWS_ROLE_ARN (la crea lab/aws/03-crear-ecr.sh).
name: ci-portal-gq

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yaml"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write          # token OIDC para asumir el rol de AWS

env:
  IMAGE_NAME: portal-gq    # repositorio en ECR
  AWS_REGION: us-east-1
  VALUES_FILE: deploy/environments/lab/values.yaml

jobs:
  build-y-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales de AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Calcular nombre y tag de la imagen
        id: meta
        run: |
          echo "image=${{ steps.ecr.outputs.registry }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build y push a ECR
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Actualizar image.tag en el values del ambiente lab
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(TAG)' "$VALUES_FILE"
          git diff -- "$VALUES_FILE"

      - name: Abrir PR con el nuevo image.tag
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/lab-image-tag
          delete-branch: true
          commit-message: "lab: portal-gq ${{ steps.meta.outputs.tag }}"
          title: "lab: desplegar portal-gq ${{ steps.meta.outputs.tag }}"
          body: |
            Actualiza `image.tag` del ambiente **lab** a `${{ steps.meta.outputs.tag }}`.

            - Imagen en ECR: `${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}`
            - Harbor la replica a `10.2.20.7/gq-apps/portal-gq` con la regla pull programada `ecr-portal-gq` (cada 5 min).
            - Fusiona cuando la réplica haya corrido; Argo CD sincroniza solo.
          add-paths: ${{ env.VALUES_FILE }}
          labels: despliegue-lab
