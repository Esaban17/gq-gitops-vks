# Pasos 1 a 3 del diagrama:
#  1) push en app/ dispara el pipeline
#  2) build de la imagen y push a GHCR (equivalente a ACR)
#  3) PR que actualiza image.tag en deploy/environments/lab/values.yaml
# Harbor replica la imagen desde GHCR (paso 4) y Argo CD despliega cuando se fusiona el PR (5 y 6).
name: ci-portal-gq

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yaml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  IMAGE_NAME: portal-gq
  VALUES_FILE: deploy/environments/lab/values.yaml

jobs:
  build-y-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular nombre y tag de la imagen
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          TAG="sha-${GITHUB_SHA::7}"
          echo "image=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push a GHCR
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Actualizar image.tag en el values del ambiente lab
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(TAG)' "$VALUES_FILE"
          git diff -- "$VALUES_FILE"

      - name: Abrir PR con el nuevo image.tag
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/lab-image-tag
          delete-branch: true
          commit-message: "lab: portal-gq ${{ steps.meta.outputs.tag }}"
          title: "lab: desplegar portal-gq ${{ steps.meta.outputs.tag }}"
          body: |
            Actualiza `image.tag` del ambiente **lab** a `${{ steps.meta.outputs.tag }}`.

            - Imagen en GHCR: `${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}`
            - Harbor la replica a `10.2.20.7/gq-apps/portal-gq` con la regla pull programada (cada 5 min).
            - Fusiona cuando la réplica haya corrido; Argo CD sincroniza solo.
          add-paths: ${{ env.VALUES_FILE }}
          labels: despliegue-lab
